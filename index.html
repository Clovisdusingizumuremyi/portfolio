<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Clovis Dusingizumuremyi | Aspiring Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Clovis Dusingizumuremyi, a third-year Computer Science student at the College of Science and Technology, Rwanda, and an aspiring Software Engineer."
    />
    <meta name="author" content="Clovis Dusingizumuremyi" />
    <meta
      name="keywords"
      content="Clovis Dusingizumuremyi, software engineer, computer science, Rwanda, React, Java, portfolio"
    />
    <meta name="theme-color" content="#050816" />

    <!-- Social sharing previews (LinkedIn, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clovis Dusingizumuremyi | Aspiring Software Engineer" />
    <meta
      property="og:description"
      content="Computer Science student at the College of Science and Technology, Rwanda. Projects, skills and contact."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before React loads, so the page never flashes the wrong theme -->
    <script>
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
